<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Am I Online?</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      .card {
        width: min(90vw, 420px);
        padding: 24px;
        border-radius: 12px;
        background: #1e293b;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 16px;
        font-size: 1.4rem;
      }

      p {
        margin: 10px 0;
        font-size: 1.05rem;
      }

      strong {
        color: #93c5fd;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(59, 130, 246, 0.18);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #22c55e;
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
        animation: pulse 1.6s infinite;
      }

      .dot.offline {
        background: #f97316;
        box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7);
      }

      .status-pill.offline {
        background: rgba(249, 115, 22, 0.18);
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
        }
        70% {
          box-shadow: 0 0 0 14px rgba(34, 197, 94, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Live Connection</h1>
      <p class="status-pill" id="status-pill">
        <span class="dot" id="status-dot" aria-hidden="true"></span>
        <strong id="online-status" aria-live="polite">
          Checking your connection...
        </strong>
      </p>
    </main>

    <script>
      const onlineStatus = document.getElementById('online-status');
      const statusPill = document.getElementById('status-pill');
      const statusDot = document.getElementById('status-dot');

      function renderOnlineStatus() {
        const isOnline = navigator.onLine;
        statusPill.classList.toggle('offline', !isOnline);
        statusDot.classList.toggle('offline', !isOnline);
        onlineStatus.textContent = isOnline
          ? 'You are online — all systems glowing ✨'
          : 'You appear to be offline right now';
      }

      renderOnlineStatus();

      window.addEventListener('online', renderOnlineStatus);
      window.addEventListener('offline', renderOnlineStatus);
    </script>
  </body>
</html>
